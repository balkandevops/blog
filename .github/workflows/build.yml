name: Build and push blog image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/blog

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update image tag in apps repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.APPS_REPO_TOKEN }}
          script: |
            const owner = 'balkandevops'
            const repo = 'apps'
            const path = 'platform-apps/services/hugo/values.yaml'
            const sha = context.sha

            const { data: file } = await github.rest.repos.getContent({ owner, repo, path })
            const content = Buffer.from(file.content, 'base64').toString()
            const updated = content.replace(/tag: .+/, `tag: "${sha}"`)

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chore: bump blog image to ${sha.slice(0, 7)}`,
              content: Buffer.from(updated).toString('base64'),
              sha: file.sha,
            })
